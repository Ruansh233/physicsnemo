case_path: examples/cfd/cavity_deeponet/cavity
run_root: examples/cfd/cavity_latent_deeponet/.foamlib_runs
run_openfoam: true
clean_run_root: false

viscosity_seed: 7
train_case_count: 40
validate_case_count: 5
test_case_count: 5
manifest_filename: viscosity_split_manifest.json

nu_min: 1.0e-3
nu_max: 1.0e-2
reynolds_min: 10.0
reynolds_max: 100.0

reconstruction_mode: pod
field_order: [u, v, w, p]
pod_modes:
  u: 4
  v: 4
  w: 2
  p: 4
autoencoder_latent_dims:
  u: 8
  v: 8
  w: 4
  p: 8

branch_layers: 4
trunk_layers: 4
decoder_layers: 2
layer_size: 128
decoder_layer_size: 128
activation_fn: gelu
learning_rate: 3.0e-3
weight_decay: 1.0e-6
train_steps: 1000
log_steps: 50
enable_realtime_loss_plot: false
lbfgs_steps: 200
lbfgs_lr: 0.3
normalize_inputs: true
normalize_targets: true
device: cpu
dtype: float32
save_visualizations: true
visualization_dir: examples/cfd/cavity_latent_deeponet/outputs/figures
visualization_max_cases: 3
model_checkpoint_path: examples/cfd/cavity_latent_deeponet/outputs/latent_deeponet_model.pt
save_trained_model: true
