case_path: examples/cfd/cavity_deeponet/cavity
run_root: examples/cfd/cavity_deeponet/.foamlib_runs
run_openfoam: true
clean_run_root: false

# Keep train and test disjoint for true unseen-viscosity evaluation.
train_viscosity_values: [1.0e-3, 5.0e-3, 1.0e-2]
test_viscosity_values: [2.5e-3, 7.5e-3]

nu_min: 1.0e-3
nu_max: 1.0e-2
reynolds_min: 10.0
reynolds_max: 100.0

latent_dim: 128
branch_layers: 4
trunk_layers: 4
layer_size: 128
activation_fn: gelu
learning_rate: 3.0e-3
weight_decay: 1.0e-6
train_steps: 1000
lbfgs_steps: 200
lbfgs_lr: 0.3
normalize_inputs: true
normalize_targets: true
device: cpu
dtype: float32
save_visualizations: true
visualization_dir: examples/cfd/cavity_deeponet/outputs/figures
visualization_max_cases: 3
